<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Pooja Pharmacy — Welcome</title>
<link rel="icon" href="pp.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root{
    --bg:#0a0f1e;--surface:#111827;--surface2:#1a2235;--border:#1e2d45;
    --accent:#00d4aa;--accent2:#0099ff;--danger:#ff4d6d;--warn:#ffb703;
    --text:#e8f0fe;--muted:#7b91b0;--white:#ffffff;
    --grad:linear-gradient(135deg,#00d4aa,#0099ff);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);
    min-height:100vh;overflow-x:hidden;position:relative;
  }

  /* ---------- Layer 0: poster background (matches the video) ---------- */
  .bg-poster{
    position:fixed;inset:-40px;z-index:0;
    background-image:url('poster.jpg');
    background-size:cover;background-position:center;
    filter:blur(26px) brightness(.42) saturate(1.15);
    transform:scale(1.12);
  }
  .bg-scrim{
    position:fixed;inset:0;z-index:1;
    background:radial-gradient(ellipse at center,rgba(10,15,30,.35) 0%,rgba(10,15,30,.88) 78%),
               linear-gradient(180deg,rgba(10,15,30,.5) 0%,rgba(10,15,30,.65) 100%);
  }

  /* ---------- Layer 1: ambient orbs (same language as login) ---------- */
  .bg-anim{position:fixed;inset:0;z-index:1;pointer-events:none;}
  .orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.16;animation:float 9s ease-in-out infinite;}
  .orb1{width:520px;height:520px;background:#00d4aa;top:-120px;left:-120px;animation-delay:0s;}
  .orb2{width:420px;height:420px;background:#0099ff;bottom:-100px;right:-100px;animation-delay:3s;}
  .orb3{width:320px;height:320px;background:#7c3aed;top:55%;left:50%;transform:translate(-50%,-50%);animation-delay:1.5s;}
  @keyframes float{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-30px) scale(1.05);}}
  body::before{
    content:'';position:fixed;inset:0;z-index:1;
    background-image:linear-gradient(rgba(0,212,170,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,170,.025) 1px,transparent 1px);
    background-size:50px 50px;
  }

  /* ---------- Landing stage ---------- */
  .landing-stage{
    position:relative;z-index:2;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;
    transition:opacity .55s cubic-bezier(.4,0,.2,1),transform .55s cubic-bezier(.4,0,.2,1),filter .55s ease;
  }
  .fade-up{opacity:0;transform:translateY(22px);animation:fadeUp .8s cubic-bezier(.2,.7,.3,1) forwards;}
  @keyframes fadeUp{to{opacity:1;transform:translateY(0);}}

  .logo-icon{
    width:78px;height:78px;background:var(--grad);border-radius:22px;
    display:flex;align-items:center;justify-content:center;
    font-size:32px;margin:0 auto 18px;
    box-shadow:0 0 40px rgba(0,212,170,.45);
    animation-delay:.05s;
  }
  h1{
    font-family:'Playfair Display',serif;font-weight:700;
    font-size:clamp(2rem,5.2vw,2.9rem);
    background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
    animation-delay:.16s;
  }
  .subtitle{
    color:var(--muted);font-size:.92rem;letter-spacing:.08em;text-transform:uppercase;
    margin-top:6px;animation-delay:.26s;
  }
  .tagline{
    color:var(--text);opacity:.75;font-size:1rem;font-weight:300;
    max-width:420px;margin:22px auto 40px;line-height:1.6;
    animation-delay:.36s;
  }

  /* ---------- Launch button: rich floating glass ---------- */
  .launch-wrap{
    position:relative;display:inline-block;
    animation-delay:.48s;
  }
  .launch-wrap .float-inner{animation:floatY 3.6s ease-in-out infinite;display:inline-block;}
  @keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-11px);}}

  .btn-ring{
    position:absolute;inset:-6px;border-radius:100px;
    border:1px solid rgba(0,212,170,.55);pointer-events:none;opacity:0;
    animation:ringPulse 2.6s ease-out infinite;
  }
  .btn-ring.r2{animation-delay:1.3s;border-color:rgba(0,153,255,.5);}
  @keyframes ringPulse{0%{transform:scale(1);opacity:.65;}100%{transform:scale(1.4);opacity:0;}}

  .launch-btn{
    position:relative;z-index:2;
    display:inline-flex;align-items:center;gap:14px;
    padding:21px 54px;border-radius:100px;
    background:rgba(255,255,255,.07);
    -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
    border:1px solid rgba(255,255,255,.2);
    color:#fff;font-family:'DM Sans',sans-serif;font-size:1.02rem;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;cursor:pointer;
    box-shadow:0 8px 34px rgba(0,212,170,.28),inset 0 1px 1px rgba(255,255,255,.28),inset 0 -1px 2px rgba(0,0,0,.25);
    transition:transform .35s cubic-bezier(.2,.8,.3,1),box-shadow .35s ease,background .35s ease,border-color .35s ease;
    overflow:hidden;isolation:isolate;
  }
  .launch-btn::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.4) 50%,transparent 65%);
    background-size:220% 100%;background-position:160% 0;
    transition:background-position .85s ease;pointer-events:none;
  }
  .launch-btn:hover{
    transform:translateY(-5px) scale(1.045);
    background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.32);
    box-shadow:0 18px 54px rgba(0,212,170,.5),inset 0 1px 1px rgba(255,255,255,.35),inset 0 -1px 2px rgba(0,0,0,.2);
  }
  .launch-btn:hover::before{background-position:-60% 0;}
  .launch-btn:active{transform:translateY(-1px) scale(.97);}
  .launch-btn:focus-visible{outline:2px solid var(--accent);outline-offset:4px;}

  .play-ico{
    display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;font-size:12px;
    background:var(--white);color:var(--bg);border-radius:50%;
    padding-left:2px; /* optical centering of triangle */
    transition:transform .35s ease;
  }
  .launch-btn:hover .play-ico{transform:scale(1.15) rotate(8deg);}
  .btn-arrow{display:inline-block;transition:transform .35s ease;}
  .launch-btn:hover .btn-arrow{transform:translateX(5px);}

  .hint{
    color:var(--muted);font-size:.82rem;margin-top:22px;letter-spacing:.03em;
    animation-delay:.6s;
  }
  .skip-line{
    margin-top:14px;animation-delay:.7s;
  }
  .skip-line a{
    color:var(--muted);font-size:.82rem;text-decoration:none;border-bottom:1px solid transparent;
    transition:color .25s ease,border-color .25s ease;
  }
  .skip-line a:hover{color:var(--accent);border-color:rgba(0,212,170,.5);}

  body.launching .landing-stage{opacity:0;transform:scale(1.1) translateY(-8px);filter:blur(10px);pointer-events:none;}
  body.playing .landing-stage{opacity:0;visibility:hidden;pointer-events:none;}

  /* ---------- Video stage ---------- */
  .video-stage{
    position:fixed;inset:0;z-index:5;background:#000;
    opacity:0;pointer-events:none;
    transition:opacity .7s ease;
  }
  body.playing .video-stage{opacity:1;pointer-events:auto;}
  #launchVideo{width:100%;height:100%;object-fit:cover;display:block;}

  .video-ui{position:absolute;inset:0;pointer-events:none;}
  .mute-btn{
    position:absolute;top:22px;right:22px;pointer-events:auto;
    width:44px;height:44px;border-radius:50%;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    color:#fff;font-size:17px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .25s ease,transform .25s ease;
  }
  .mute-btn:hover{background:rgba(255,255,255,.16);transform:scale(1.06);}
  .mute-btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}

  .skip-btn{
    position:absolute;bottom:max(26px,env(safe-area-inset-bottom));right:26px;pointer-events:auto;
    padding:12px 22px;border-radius:100px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    color:#fff;font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:500;letter-spacing:.03em;
    cursor:pointer;opacity:0;transform:translateY(10px);
    transition:opacity .5s ease,transform .5s ease,background .25s ease;
  }
  .skip-btn.show{opacity:1;transform:translateY(0);}
  .skip-btn:hover{background:rgba(255,255,255,.16);}
  .skip-btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}

  .progress-track{
    position:absolute;left:0;right:0;bottom:0;height:3px;
    background:rgba(255,255,255,.12);
  }
  .progress-fill{height:100%;width:0%;background:var(--grad);transition:width .12s linear;}

  .spinner{
    position:absolute;top:50%;left:50%;width:38px;height:38px;margin:-19px 0 0 -19px;
    border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:var(--accent);
    opacity:0;transition:opacity .3s ease;animation:spin 1s linear infinite;pointer-events:none;
  }
  .spinner.show{opacity:1;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Exit veil ---------- */
  .veil{position:fixed;inset:0;z-index:10;background:#000;opacity:0;pointer-events:none;transition:opacity .65s ease;}
  body.leaving .veil{opacity:1;}

  @media (max-width:520px){
    .launch-btn{padding:18px 40px;gap:11px;font-size:.92rem;letter-spacing:.1em;}
    .tagline{font-size:.92rem;margin:16px auto 32px;}
    .skip-btn{right:16px;padding:10px 18px;font-size:.8rem;}
    .mute-btn{top:16px;right:16px;width:40px;height:40px;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.15s !important;}
    .orb,.launch-wrap .float-inner,.btn-ring{animation:none !important;}
  }
</style>
</head>
<body>

<div class="bg-poster"></div>
<div class="bg-scrim"></div>
<div class="bg-anim">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>

<div class="landing-stage" id="landingStage">
  <div class="logo-icon fade-up">💊</div>
  <h1 class="fade-up">Pooja Pharmacy</h1>
  <p class="subtitle fade-up">Stock Management System</p>
  <p class="tagline fade-up">Inventory, billing, and reports — all in one place.</p>

  <div class="launch-wrap fade-up">
    <div class="float-inner">
      <span class="btn-ring"></span>
      <span class="btn-ring r2"></span>
      <button class="launch-btn" id="launchBtn" aria-label="Launch Pooja Pharmacy">
        <span class="play-ico">▶</span>
        <span>Launch</span>
        <span class="btn-arrow">→</span>
      </button>
    </div>
  </div>

  <p class="hint fade-up">Click Launch to begin</p>
  <p class="skip-line fade-up"><a href="login.html" id="skipToLogin">Skip the intro, go straight to sign in</a></p>
</div>

<div class="video-stage" id="videoStage">
  <video id="launchVideo" src="LAUNCH.mp4" poster="poster.jpg" preload="auto" playsinline webkit-playsinline="true"></video>
  <div class="video-ui">
    <button class="mute-btn" id="muteBtn" aria-label="Toggle sound">🔊</button>
    <div class="spinner" id="spinner"></div>
    <button class="skip-btn" id="skipBtn">Skip intro →</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>
</div>

<div class="veil"></div>

<script>
(function(){
  var body = document.body;
  var launchBtn = document.getElementById('launchBtn');
  var video = document.getElementById('launchVideo');
  var skipBtn = document.getElementById('skipBtn');
  var muteBtn = document.getElementById('muteBtn');
  var spinner = document.getElementById('spinner');
  var progressFill = document.getElementById('progressFill');

  var launched = false;
  var redirecting = false;
  var skipTimer = null;

  function startLaunch(){
    if (launched) return;
    launched = true;

    // Call play() synchronously inside the click handler so mobile
    // browsers treat this as a genuine user gesture and allow sound.
    video.currentTime = 0;
    video.muted = false;
    var p = video.play();
    if (p !== undefined) {
      p.catch(function(){
        // Autoplay with sound was blocked — fall back to muted playback
        // rather than leaving the launch stuck.
        video.muted = true;
        muteBtn.textContent = '🔇';
        video.play();
      });
    }

    body.classList.add('launching');
    window.setTimeout(function(){
      body.classList.add('playing');
      skipTimer = window.setTimeout(function(){
        skipBtn.classList.add('show');
      }, 2000);
    }, 550);
  }

  function goToLogin(){
    if (redirecting) return;
    redirecting = true;
    if (skipTimer) window.clearTimeout(skipTimer);
    body.classList.add('leaving');
    window.setTimeout(function(){
      window.location.href = 'login.html';
    }, 650);
  }

  launchBtn.addEventListener('click', startLaunch);
  video.addEventListener('ended', goToLogin);
  video.addEventListener('error', function(){ if (launched) goToLogin(); });
  skipBtn.addEventListener('click', goToLogin);

  video.addEventListener('waiting', function(){ spinner.classList.add('show'); });
  video.addEventListener('playing', function(){ spinner.classList.remove('show'); });

  video.addEventListener('timeupdate', function(){
    if (video.duration) {
      progressFill.style.width = (video.currentTime / video.duration * 100) + '%';
    }
  });

  muteBtn.addEventListener('click', function(){
    video.muted = !video.muted;
    muteBtn.textContent = video.muted ? '🔇' : '🔊';
  });

  document.addEventListener('keydown', function(e){
    if (body.classList.contains('playing') && e.key === 'Escape') goToLogin();
  });
})();
</script>
</body>
</html>
